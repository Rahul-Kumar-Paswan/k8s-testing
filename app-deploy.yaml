apiVersion: apps/v1
kind: Deployment
metadata:
  name: rahulverse-app
  namespace: rahulverse-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rahulverse-app
  template:
    metadata:
      labels:
        app: rahulverse-app
    spec:
      containers:
      - name: rahulverse-app
        image: rahulkumarpaswan/rahulverse-app:latest
        ports:
        - containerPort: 8089
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: rahulverse-app
  namespace: rahulverse-prod
spec:
  type: ClusterIP
  selector:
    app: rahulverse-app
  ports:
  - port: 8089
    targetPort: 8089
