alertmanager:
  enabled: false

prometheus:
  prometheusSpec:
    service:
      type: LoadBalancer
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: ebs-sc   # ✅ make sure this matches your cluster
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi

grafana:
  enabled: true
  service:
    type: LoadBalancer
  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password

nodeExporter:
  enabled: true
  service:
    type: ClusterIP  # ✅ node-exporter usually runs as DaemonSet, not LB

kubeStateMetrics:
  enabled: true
  service:
    type: ClusterIP  # ✅ same here, don’t expose directly outside

additionalScrapeConfigs:
      - job_name: node-exporter
        static_configs:
          - targets: ['node-exporter:9100']
      - job_name: kube-state-metrics
        static_configs:
          - targets: ['kube-state-metrics:8080']
